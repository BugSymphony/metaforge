# ===== MetaForge 应用统一配置 =====
server:
  port: 8080

spring:
  application:
    name: metaforge
  config:
    import:
      - classpath:application-metaforge-compute-engine.yml
      - classpath:application-metaforge-graph.yml
      - classpath:application-metaforge-agent-cognition.yml
  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/metaforge
    username: metaforge
    password: metaforge
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # Caffeine 缓存
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=30m,maximumSize=1000,recordStats
  # Jackson 序列化
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  # 虚拟线程
  threads:
    virtual:
      enabled: true
  # 国际化
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  # 安全基线
  servlet:
    multipart:
      max-request-size: 10MB

# Actuator 可观测性
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: when-authorized
    env:
      show-values: always

# SpringDoc OpenAPI
springdoc:
  swagger-ui:
    tags-sorter: alpha

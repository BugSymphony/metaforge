# cognition-templates.yml
# 定义内置认知查询模板，每种模板指定预配置的视角组合、深度裁剪和代理适配策略
templates:
  - templateId: "bundle-catalog"
    description: "Bundle 目录概览与主题域导航"
    perspectives:
      - "bundle_directory"
      - "domain_navigation"
    depthTrim: "L1"
    archetypeAdapt: "exploration"
    outputFormat: "json"
    contextMode: "BUNDLE_LEVEL"

  - templateId: "cognition-guidance"
    description: "统一元认知查询引擎——全视角通用模板"
    perspectives:
      - "entity_profile"
      - "domain_location"
      - "composition_tree"
      - "relationship_graph"
      - "constraint_set"
      - "capability_catalog"
      - "flow_blueprint"
      - "decision_matrix"
      - "impact_trace"
      - "prerequisite_chain"
    depthTrim: "L2"
    archetypeAdapt: "execution"
    outputFormat: "json"

  - templateId: "task-brief"
    description: "一站式任务元认知简报——全量捆绑视角"
    perspectives:
      - "entity_profile"
      - "domain_location"
      - "composition_tree"
      - "relationship_graph"
      - "constraint_set"
      - "capability_catalog"
      - "flow_blueprint"
      - "decision_matrix"
      - "impact_trace"
      - "prerequisite_chain"
    depthTrim: "L2"
    archetypeAdapt: "execution"
    outputFormat: "json"

  - templateId: "step-guide"
    description: "实体级即时指导——仅执行实体级/双向视角"
    perspectives:
      - "entity_profile"
      - "constraint_set"
      - "capability_catalog"
      - "decision_matrix"
      - "impact_trace"
      - "relationship_graph"
    depthTrim: "L2"
    archetypeAdapt: "execution"
    contextMode: "ENTITY_LEVEL"
    outputFormat: "json"

  - templateId: "navigate"
    description: "渐进式域导航——懒加载分层遍历"
    perspectives:
      - "domain_navigation"
    depthTrim: "L1"
    archetypeAdapt: "exploration"
    expand: "lazy"
    outputFormat: "json"

  - templateId: "sub-task-brief"
    description: "层级化子任务元认知简报——支持 INHERITED/PURE 作用域模式"
    perspectives:
      - "entity_profile"
      - "constraint_set"
      - "capability_catalog"
      - "decision_matrix"
      - "prerequisite_chain"
      - "relationship_graph"
    depthTrim: "L2"
    archetypeAdapt: "execution"
    outputFormat: "json"

# cognition-perspectives.yml
# 定义 14 个内置认知视角的元信息
perspectives:
  - perspectiveId: "entity_profile"
    scope: "BOTH"
    description: "实体画像——包含实体的完整 M1 实例内容、所属 EntitySchema 的结构说明、历史版本信息"

  - perspectiveId: "domain_location"
    scope: "ENTITY"
    description: "领域定位——从实体 FQN 沿 COMPOSITION 入边反向追溯的完整归属路径"

  - perspectiveId: "composition_tree"
    scope: "ENTITY"
    description: "组成结构——包含 COMPOSITION 关系展开的树形结构"

  - perspectiveId: "relationship_graph"
    scope: "ENTITY"
    description: "关系图谱——按照 AssociationType 分组的邻域实体列表和关系列表"

  - perspectiveId: "constraint_set"
    scope: "BOTH"
    description: "约束规则——包含约束条目、硬边界、软边界三类约束"

  - perspectiveId: "capability_catalog"
    scope: "BOTH"
    description: "能力目录——包含能力列表、接口说明、调用方法、协议子类型详情"

  - perspectiveId: "flow_blueprint"
    scope: "BUNDLE"
    description: "流程蓝图——基于 PROCESS_SEQUENCE 关系拓扑的步骤序列"

  - perspectiveId: "decision_matrix"
    scope: "BOTH"
    description: "决策图谱——包含决策点及其可选路径、触发条件、下游影响"

  - perspectiveId: "impact_trace"
    scope: "ENTITY"
    description: "影响追溯——包含正向影响扩散、反向依赖溯源、影响路径详情"

  - perspectiveId: "prerequisite_chain"
    scope: "BOTH"
    description: "前置依赖——按层级展开的依赖树"

  - perspectiveId: "domain_navigation"
    scope: "BUNDLE"
    description: "主题域导航——渐进式懒加载导航路径结构"

  - perspectiveId: "instance_catalog"
    scope: "BOTH"
    description: "实例目录——指定 Bundle 的 M1 实例及关系清单"

  - perspectiveId: "bundle_directory"
    scope: "BUNDLE"
    description: "Bundle 目录——已发布 Bundle 实例列表及主题域树"

  - perspectiveId: "schema_inventory"
    scope: "BUNDLE"
    description: "Schema 库存——指定 Bundle 下的 EntitySchema 清单及实例数量统计"

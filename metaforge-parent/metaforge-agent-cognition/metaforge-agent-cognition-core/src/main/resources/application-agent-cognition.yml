# ============================================================================
# 认知基础架构层 (agent-cognition) 统一配置文件
# 前缀: metaforge.agent-cognition
# 零配置可用: 所有参数具有合理默认值，缺失时系统正常启动
# ============================================================================

metaforge:
  agent-cognition:
    # ------------------------------------------------------------------------
    # 模板扫描配置
    # ------------------------------------------------------------------------
    templates:
      # classpath 下模板 YAML 文件扫描路径（Ant 风格通配符）
      classpath-location: classpath:cognition/templates/
      # 外部模板目录路径（file: 协议），外部模板优先级高于 classpath 模板
      # 可通过环境变量 META_FORGE_CONFIG 覆盖: ${META_FORGE_CONFIG:cognition}/templates/
      external-location:
      # 外部模板热加载配置
      hot-reload:
        # 是否启用外部模板文件热加载监听（生产环境建议关闭）
        enabled: false
        # 文件轮询间隔（毫秒）
        poll-interval-ms: 5000

    # ------------------------------------------------------------------------
    # 认知查询默认参数
    # ------------------------------------------------------------------------
    defaults:
      # 默认认知深度: L1(概览) / L2(标准) / L3(全量)
      cognition-depth: L2
      # 默认 Agent 原型: execution(执行型) / exploration(探索型) / audit(审计型) / orchestration(编排型)
      agent-archetype: execution
      # 默认输出格式: json(结构化JSON) / prompt(Markdown文本)
      format: json
      # 默认最大 Token 预算，<500 自动降级为 L1
      max-tokens: 8000
      # 默认分页大小
      page-size: 20

    # ------------------------------------------------------------------------
    # 超时控制参数
    # ------------------------------------------------------------------------
    timeouts:
      # 单个算子默认执行超时时间（毫秒）
      operator-execute-default-ms: 10000

    # ------------------------------------------------------------------------
    # 认知深度裁剪比例
    # ------------------------------------------------------------------------
    depth:
      # L1 深度: 非强制算子保留比例（不低于 min-keep）
      trim-ratio-l1: 0.33
      # L2 深度: 非强制算子保留比例（不低于 min-keep）
      trim-ratio-l2: 0.67
      # 最小保留数量（非强制算子至少保留 min-keep 个）
      min-keep: 3

    # ------------------------------------------------------------------------
    # 版本锚策略
    # ------------------------------------------------------------------------
    version-anchor:
      # Bundle 版本解析策略: LATEST_PUBLISHED(最新已发布版本)
      bundle-resolve-strategy: LATEST_PUBLISHED
